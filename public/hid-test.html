<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperStrike Studio Plus</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; background: #111; color: #eee; }
  button { font: inherit; padding: .4rem .9rem; margin: .2rem .2rem .2rem 0; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  fieldset { border: 1px solid #444; border-radius: 6px; margin: 1rem 0; }
  label { display: flex; justify-content: space-between; align-items: center; margin: .4rem 0; }
  input[type=number] { width: 4rem; font: inherit; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  #status { color: #8cf; }
  #log { background: #000; color: #9c9; font: 12px/1.3 monospace; height: 14rem; overflow: auto; padding: .5rem; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>SuperStrike Studio Plus</h1>
<p>Test page for PRO X2 / X3 SUPERSTRIKE HITS settings over WebHID. Chrome or Edge only.</p>

<button id="connect">Connect</button>
<button id="read" disabled>Read</button>
<button id="apply" disabled>Apply</button>
<button id="restore" disabled>Restore original</button>
<p id="status">Not connected.</p>

<div class="grid">
  <fieldset><legend>Left button</legend>
    <label>Actuation (1–10) <input type="number" id="act0" min="1" max="10"></label>
    <label>Rapid trigger <input type="checkbox" id="rton0"></label>
    <label>Rapid trigger level (1–5) <input type="number" id="rt0" min="1" max="5"></label>
    <label>Haptics (0–5) <input type="number" id="hap0" min="0" max="5"></label>
  </fieldset>
  <fieldset><legend>Right button</legend>
    <label>Actuation (1–10) <input type="number" id="act1" min="1" max="10"></label>
    <label>Rapid trigger <input type="checkbox" id="rton1"></label>
    <label>Rapid trigger level (1–5) <input type="number" id="rt1" min="1" max="5"></label>
    <label>Haptics (0–5) <input type="number" id="hap1" min="0" max="5"></label>
  </fieldset>
</div>

<pre id="log"></pre>

<script>
// HID++ 2.0 over WebHID. Only two features are used: IRoot (0x0000) to find the
// HITS feature (0x1B0C), and HITS itself (fn2 = get, fn1 = set). Nothing else is ever written.
const $ = id => document.getElementById(id);
const SWID = 0x0B;
const HITS = 0x1B0C;
let dev = null, devIdx = 0, hitsIdx = 0, original = null;

const log = msg => { $('log').textContent += msg + '\n'; $('log').scrollTop = 1e9; };
const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join(' ');
const status = msg => { $('status').textContent = msg; log('# ' + msg); };

// Sends a long report (0x11) and resolves with the 16 reply parameter bytes.
function request(feat, fn, params = [], timeout = 1000) {
  const out = new Uint8Array(19);
  out[0] = devIdx; out[1] = feat; out[2] = (fn << 4) | SWID;
  out.set(params.slice(0, 16), 3);
  return new Promise((resolve, reject) => {
    const done = () => { clearTimeout(timer); dev.removeEventListener('inputreport', onReport); };
    const timer = setTimeout(() => { done(); reject(new Error(`timeout dev=${devIdx} feat=${feat} fn=${fn}`)); }, timeout);
    function onReport(e) {
      if (e.reportId !== 0x10 && e.reportId !== 0x11) return;
      const r = new Uint8Array(e.data.buffer, e.data.byteOffset, e.data.byteLength);
      if (r[0] !== devIdx) return;
      if (r[1] === 0xFF && r[2] === feat && r[3] === out[2]) {
        done(); log('<- ' + hex(r)); reject(new Error(`HID++ error ${r[4]} (feat=${feat} fn=${fn})`));
      } else if (r[1] === feat && r[2] === out[2]) {
        done(); log('<- ' + hex(r)); resolve(r.slice(3));
      }
    }
    dev.addEventListener('inputreport', onReport);
    log('-> ' + hex(out));
    dev.sendReport(0x11, out).catch(err => { done(); reject(err); });
  });
}

async function connect() {
  if (!navigator.hid) return status('WebHID is not available. Use Chrome or Edge, from localhost or file://.');
  const policy = document.permissionsPolicy || document.featurePolicy;
  if (policy && !policy.allowsFeature('hid'))
    return status('WebHID is blocked here (embedded preview or iframe). Open this page in a normal Chrome or Edge window: ' + location.href);
  // HID++ lives on a vendor usage page: 0xFF43 on LIGHTSPEED receivers (c54f), 0xFF00 on older ones.
  const [d] = await navigator.hid.requestDevice({ filters: [
    { vendorId: 0x046d, usagePage: 0xff43 }, { vendorId: 0x046d, usagePage: 0xff00 },
  ] });
  if (!d) return status('No device selected.');
  dev = d;
  if (!dev.opened) await dev.open();
  status(`Opened ${dev.productName} (${dev.vendorId.toString(16)}:${dev.productId.toString(16)}). Looking for the mouse…`);

  // Receiver slots 1..6, then 0xFF for a cable connection.
  for (const i of [1, 2, 3, 4, 5, 6, 0xFF]) {
    devIdx = i;
    try {
      await request(0x00, 1, [0, 0, 0x5A], 800);  // ping
      const idx = (await request(0x00, 0, [HITS >> 8, HITS & 0xFF]))[0];
      log(`# device ${i}: HITS feature index ${idx}`);
      if (idx) { hitsIdx = idx; break; }
    } catch (err) { log(`# device ${i}: ${err.message}`); }
  }
  if (!hitsIdx) return status('No mouse with the HITS feature (0x1B0C) found. Is the mouse awake?');

  status(`Found ${await readName()} at device ${devIdx}, HITS index ${hitsIdx}.`);
  ['read', 'apply', 'restore'].forEach(id => $(id).disabled = false);
  $('connect').disabled = true;
  original = await read();
  log('# original: ' + JSON.stringify(original));
}

async function readName() {
  try {
    const nameIdx = (await request(0x00, 0, [0x00, 0x05]))[0];
    if (!nameIdx) return 'mouse';
    const len = (await request(nameIdx, 0))[0];
    let name = '';
    while (name.length < len) {
      const r = await request(nameIdx, 1, [name.length]);
      name += String.fromCharCode(...r.slice(0, Math.min(16, len - name.length)));
    }
    return name.replace(/\0/g, '').trim();
  } catch { return 'mouse'; }
}

async function read() {
  const vals = [];
  for (const b of [0, 1]) {
    const r = await request(hitsIdx, 2, [b]);
    const h = { act: r[1] >> 2, rt: r[2] >> 2, rtOn: (r[2] & 1) === 1, hap: r[3] >> 2 };
    vals.push(h);
    $('act' + b).value = h.act; $('rt' + b).value = h.rt; $('rton' + b).checked = h.rtOn; $('hap' + b).value = h.hap;
  }
  status('Read HITS from the mouse.');
  return vals;
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, Math.round(Number(v)) || lo));

async function write(vals) {
  for (const b of [0, 1]) {
    const h = vals[b];
    await request(hitsIdx, 1, [b, clamp(h.act, 1, 10) << 2, (clamp(h.rt, 1, 5) << 2) | (h.rtOn ? 1 : 0), clamp(h.hap, 0, 5) << 2]);
  }
  await read();  // read back so the form shows what the mouse actually has
  status('Applied and read back.');
}

const formValues = () => [0, 1].map(b => ({
  act: $('act' + b).value, rt: $('rt' + b).value, rtOn: $('rton' + b).checked, hap: $('hap' + b).value,
}));

const guard = fn => async () => { try { await fn(); } catch (err) { status('Error: ' + err.message); } };
$('connect').onclick = guard(connect);
$('read').onclick = guard(read);
$('apply').onclick = guard(() => write(formValues()));
$('restore').onclick = guard(() => write(original));
navigator.hid?.addEventListener('disconnect', e => {
  if (e.device !== dev) return;
  dev = null; hitsIdx = 0;
  ['read', 'apply', 'restore'].forEach(id => $(id).disabled = true);
  $('connect').disabled = false;
  status('Receiver disconnected.');
});
</script>
</body>
</html>
