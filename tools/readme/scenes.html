<!doctype html>
<meta charset="utf-8">
<!-- README illustrations: what each click setting means, drawn on the app's mouse picture frame by frame.
     load(svg) takes src/mouse_top.svg; render(name, t) draws scene `name` at t seconds and returns the RGBA
     pixels as base64. illustrations.mjs records them. -->
<body style="margin:0;background:#000">
<canvas id="c" width="480" height="360"></canvas>
<script>
let W = 480, H = 360;
const g = document.getElementById("c").getContext("2d");
const BG = "#222226", ACCENT = "#3b9cff", ORANGE = "#ff9e33";
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
const rgba = (hex, a) => {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`;
};
const dot = (x, y, r) => (g.beginPath(), g.arc(x, y, r, 0, Math.PI * 2));

// ---------------------------------------------------------------- the mouse, as MouseView draws it

const pics = {};
const attr = (s, name) => new RegExp(`\\b${name}="([^"]*)"`).exec(s)?.[1] ?? "";

/** view "top" or "side": src/mouse_top.svg or src/mouse_side.svg */
window.load = (view, svg) => {
  const [, w, h] = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(svg);
  const parts = [], groups = [], zones = {};
  for (const m of svg.matchAll(/<g\b([^>]*)>|<\/g>|<path\b([^>]*?)\/?>/g)) {
    if (m[0] === "</g>") groups.pop();
    else if (m[1] !== undefined) groups.push(attr(m[1], "id"));
    else {
      const a = m[2], cls = attr(a, "class");
      const kind = cls.includes("zone") ? "zone" : cls.includes("body") ? "body" : cls.includes("wheel") ? "wheel"
        : cls.includes("line") ? "line" : groups.includes("brand") ? "brand" : "line";
      const path = new Path2D(attr(a, "d"));
      parts.push({ kind, id: attr(a, "id"), width: cls.includes("bold") ? 7 : cls.includes("thin") ? 2.4 : 4, path });
      if (kind === "zone") zones[attr(a, "id")] = { path, ...centroid(+w, +h, path) };
    }
  }
  pics[view] = { w: +w, h: +h, parts, zones };
};

function centroid(w, h, path) {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  const cg = c.getContext("2d");
  cg.fill(path);
  const d = cg.getImageData(0, 0, w, h).data;
  let sx = 0, sy = 0, n = 0, top = h, bottom = 0;
  for (let y = 0; y < h; y += 3)
    for (let x = 0; x < w; x += 3)
      if (d[(y * w + x) * 4 + 3] > 100) (sx += x), (sy += y), n++, (top = Math.min(top, y)), (bottom = Math.max(bottom, y));
  return { cx: sx / n, cy: sy / n, top, bottom };
}

/** The drawing itself, in drawing units, under the current transform. */
function outline(pic) {
  g.lineCap = g.lineJoin = "round";
  for (const p of pic.parts) {
    if (p.kind === "body") (g.fillStyle = "#ffffff"), g.fill(p.path);
    else if (p.kind === "wheel") (g.fillStyle = "#6e6e75"), g.fill(p.path);
    else if (p.kind === "brand") (g.fillStyle = "#9c9ca3"), g.fill(p.path);
    else if (p.kind === "line") (g.strokeStyle = "#16161a"), (g.lineWidth = p.width), g.stroke(p.path);
  }
}

/**
 * The mouse at height h, top-left (x, y). o.view "top" (default) or "side"; o.zone the button that
 * o.press, o.glow and o.ripples apply to (default the left button); o.side 0..1 lights the front
 * thumb button (top view). Returns where that button sits on the canvas.
 */
function mouse(x, y, h, o = {}) {
  const pic = pics[o.view ?? "top"], zone = pic.zones[o.zone ?? "btn-left"];
  const s = h / pic.h, r = { x, y, w: pic.w * s, h };
  g.save(); // floor shadow
  g.translate(x + r.w / 2, y + h * 0.98);
  g.scale(r.w * 0.42, 14);
  dot(0, 0, 1);
  g.restore();
  g.fillStyle = "rgba(0,0,0,0.28)";
  g.fill();
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  outline(pic);
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (o.side) {
    const sx = x + 28 * s, sy = y + 497 * s, rg = g.createRadialGradient(sx, sy, 0, sx, sy, 22);
    rg.addColorStop(0, rgba(ACCENT, 0.9 * o.side));
    rg.addColorStop(1, rgba(ACCENT, 0));
    g.fillStyle = rg;
    g.fillRect(sx - 22, sy - 22, 44, 44);
    g.fillStyle = rgba(ACCENT, o.side);
    g.beginPath();
    g.roundRect(sx - 3, sy - 40 * s, 6, 80 * s, 3);
    g.fill();
  }
  g.translate(x, y);
  g.scale(s, s);
  g.clip(zone.path);
  g.setTransform(1, 0, 0, 1, 0, 0);
  const bx = x + zone.cx * s, by = y + zone.cy * s;
  // press shade and glow, as on the app's live mouse
  g.fillStyle = `rgba(0,0,0,${0.18 * (o.press ?? 0)})`;
  g.fillRect(x, y, r.w, h);
  g.fillStyle = rgba(ACCENT, 0.55 * (o.glow ?? 0));
  g.fillRect(x, y, r.w, h);
  for (const [age, color] of o.ripples ?? []) {
    const k = age / 0.6;
    if (k < 0 || k >= 1) continue;
    dot(bx, by, 6 + r.w * 0.45 * (1 - (1 - k) * (1 - k)));
    g.fillStyle = rgba(color, 0.3 * (1 - k));
    g.fill();
    g.strokeStyle = `rgba(255,255,255,${0.75 * (1 - k)})`;
    g.lineWidth = 3;
    g.stroke();
  }
  g.restore();
  return { bx, by, top: y + zone.top * s, bottom: y + zone.bottom * s, right: x + r.w };
}

/** The pointer arrow with its tip at (x, y). */
function cursor(x, y, color = "#fff") {
  g.save();
  g.translate(x, y);
  g.beginPath();
  g.moveTo(0, 0);
  g.lineTo(0, 19);
  g.lineTo(5, 14.5);
  g.lineTo(8.5, 22);
  g.lineTo(11.5, 20.6);
  g.lineTo(8, 13.3);
  g.lineTo(14, 13.3);
  g.closePath();
  g.fillStyle = color;
  g.fill();
  g.strokeStyle = "#000";
  g.lineWidth = 1.4;
  g.lineJoin = "round";
  g.stroke();
  g.restore();
}

/** An icon in a callout box centred on (cx, cy). */
function bubble(cx, cy, size, name, color = ACCENT) {
  g.fillStyle = "rgb(31,31,36)";
  g.strokeStyle = color;
  g.lineWidth = 2;
  g.beginPath();
  g.roundRect(cx - size / 2, cy - size / 2, size, size, size * 0.22);
  g.fill();
  g.stroke();
  icon(name, cx - size / 4, cy - size / 4, size / 2, "#fff");
}

/** A callout line from a point on the mouse to a bubble at (bx, by), popping in over `pop` 0..1. */
function callout(zx, zy, bx, by, size, name, pop, color = ACCENT) {
  if (pop <= 0) return;
  const e = ease(pop), sz = size * e, ex = bx + (zx < bx ? -1 : 1) * sz / 2;
  g.strokeStyle = color;
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(zx, zy);
  g.lineTo(zx + (ex - zx) * e, zy + (by - zy) * e);
  g.stroke();
  g.fillStyle = color;
  dot(zx, zy, 5);
  g.fill();
  if (sz > 4) bubble(bx, by, sz, name, color);
}

/** The app's icons (src/components/icons.tsx, added by illustrations.mjs) plus a play/pause one. */
const ICONS = {
  media: "M1 3L8 8L1 13Z M9.5 3H12V13H9.5Z M13.5 3H16V13H13.5Z",
};

/** A 16x16 icon at (x, y), `size` px. */
function icon(name, x, y, size, color) {
  const k = size / 16;
  g.save();
  g.translate(x, y);
  g.scale(k, k);
  g.fillStyle = color;
  g.fill(new Path2D(ICONS[name]));
  g.restore();
}

/** A monitor with its screen at (x, y, w, h). */
function monitor(x, y, w, h) {
  g.fillStyle = "#3a3a40";
  g.beginPath();
  g.roundRect(x - 8, y - 8, w + 16, h + 16, 12);
  g.fill();
  g.fillStyle = "#2b2f38";
  g.beginPath();
  g.roundRect(x, y, w, h, 6);
  g.fill();
}

// ---------------------------------------------------------------- press-travel gauge (the app's travel bar, upright)

const SEGS = 10;
/** Button travel 0 (up) .. 1 (bottomed out) beside the button; `at` the click point, `band` the rapid trigger lift. */
function gauge(x, top, bottom, o) {
  const sh = (bottom - top) / SEGS, w = 14;
  for (let i = 0; i < SEGS; i++) {
    const y = top + i * sh, through = o.depth * SEGS > i + 0.02;
    g.fillStyle = through ? (o.clicked ? ACCENT : "rgba(255,255,255,0.6)") : "rgba(255,255,255,0.1)";
    g.beginPath();
    g.roundRect(x, y + 1.5, w, sh - 3, 3);
    g.fill();
  }
  const ay = top + o.at * (bottom - top);
  g.fillStyle = ACCENT;
  g.beginPath();
  g.roundRect(x - 4, ay - 2, w + 8, 4, 2);
  g.fill();
  g.fillStyle = "#fff";
  g.beginPath();
  g.moveTo(x - 13, ay - 6);
  g.lineTo(x - 13, ay + 6);
  g.lineTo(x - 6, ay);
  g.fill();
  if (o.band) {
    const [y0, y1] = o.band.map((d) => top + d * (bottom - top));
    g.fillStyle = rgba(ORANGE, 0.85);
    g.beginPath();
    g.roundRect(x + w + 5, y0, 6, Math.max(6, y1 - y0), 3);
    g.fill();
  }
}

// ---------------------------------------------------------------- timing

/** Click and release times up to t for travel depth(s): fires at `A`; with rapid trigger also re-arms after lifting `rt`. */
function clicks(depth, t, A, rt = 0) {
  const out = [];
  let pressed = false, lo = 0, hi = 0;
  for (let s = 0; s <= t + 1e-9; s += 0.002) {
    const d = depth(s);
    if (!pressed) {
      lo = Math.min(lo, d);
      if (d >= A && (!rt || d >= lo + rt)) (pressed = true), (hi = d), out.push(s);
    } else {
      hi = Math.max(hi, d);
      if (d < A || (rt && d <= hi - rt)) (pressed = false), (lo = d);
    }
  }
  return { times: out, pressed, hi };
}
const glowOf = (c, t) => (c.pressed ? 1 : c.times.length ? clamp(1 - (t - c.times.at(-1)) / 0.15) : 0);

function clear() {
  g.fillStyle = BG;
  g.fillRect(0, 0, W, H);
}

function counter(cx, y, n, filled, color, t, times) {
  const x0 = cx - ((n - 1) * 22) / 2;
  for (let i = 0; i < n; i++) {
    const on = i < filled, pop = on ? clamp((t - times[i]) / 0.18) : 1;
    g.fillStyle = on ? color : "rgba(255,255,255,0.12)";
    dot(x0 + i * 22, y, on ? 6.5 * (1 + 0.5 * Math.sin(pop * Math.PI)) : 6.5);
    g.fill();
  }
}

const MOUSE_H = 290, MOUSE_Y = 18;
const mouseW = (h = MOUSE_H, view = "top") => (pics[view].w * h) / pics[view].h;

// ---------------------------------------------------------------- scenes

const SCENES = {
  /** The same press on two mice: the shallow click point fires early, the deep one near the bottom. */
  actuation: {
    duration: 3.0,
    draw(t) {
      const depth = (s) => (s < 0.2 ? 0 : s < 1.3 ? seg(s, 0.2, 1.3) : s < 1.6 ? 1 : s < 2.1 ? 1 - ease(seg(s, 1.6, 2.1)) : 0);
      clear();
      for (const [cx, A] of [[W * 0.27, 0.15], [W * 0.73, 0.85]]) {
        const x = cx - mouseW() / 2 + 16, c = clicks(depth, t, A);
        const fired = clicks(depth, 3, A).times[0];
        const m = mouse(x, MOUSE_Y, MOUSE_H, { press: depth(t), glow: glowOf(c, t), ripples: c.times.map((s) => [t - s, ACCENT]) });
        gauge(x - 32, m.top + 10, m.bottom - 10, { depth: depth(t), at: A, clicked: c.pressed });
        // how long the press took to click
        const len = (Math.min(t, fired) - 0.2) * 100;
        g.fillStyle = "rgba(255,255,255,0.10)";
        g.beginPath();
        g.roundRect(cx - 60, 334, 120, 10, 5);
        g.fill();
        if (t > 0.2 && t < 2.2) {
          g.fillStyle = ACCENT;
          g.beginPath();
          g.roundRect(cx - 60, 334, Math.max(10, len), 10, 5);
          g.fill();
        }
      }
    },
  },

  /** The same quick bounces of the button: without rapid trigger one click counts, with it every bounce does. */
  rapid: {
    duration: 3.1,
    draw(t) {
      const depth = (s) => {
        if (s < 0.2) return 0;
        if (s < 0.6) return 0.95 * ease(seg(s, 0.2, 0.6));
        if (s < 1.88) return 0.95 - 0.3 * Math.sin(((s - 0.6) / 0.32) * Math.PI) ** 2;
        if (s < 2.25) return 0.95 * (1 - ease(seg(s, 1.88, 2.25)));
        return 0;
      };
      clear();
      for (const [cx, rt] of [[W * 0.27, 0], [W * 0.73, 0.15]]) {
        const x = cx - mouseW() / 2 + 16, c = clicks(depth, t, 0.45, rt), color = rt ? ORANGE : ACCENT;
        const m = mouse(x, MOUSE_Y, MOUSE_H, { press: depth(t), glow: glowOf(c, t), ripples: c.times.map((s) => [t - s, color]) });
        const band = rt && c.pressed ? [c.hi - rt, c.hi] : null;
        gauge(x - 32, m.top + 10, m.bottom - 10, { depth: depth(t), at: 0.45, clicked: c.pressed, band });
        if (t < 2.75) counter(cx, 338, 5, c.times.length, color, t, c.times);
        else counter(cx, 338, 5, 0, color, t, []);
      }
    },
  },

  /** Six clicks, each one stronger: no vibration, then a light tap up to a firm thump. */
  haptics: {
    duration: 3.9,
    draw(t) {
      const P = 0.62;
      const depth = (s) => {
        const k = Math.floor(s / P), u = s - k * P;
        if (k > 5) return 0;
        return u < 0.1 ? 0 : u < 0.2 ? ease(seg(u, 0.1, 0.2)) : u < 0.26 ? 1 : u < 0.38 ? 1 - ease(seg(u, 0.26, 0.38)) : 0;
      };
      clear();
      const c = clicks(depth, t, 0.5);
      const level = c.times.length ? c.times.length - 1 : 0;
      const age = c.times.length ? t - c.times.at(-1) : 9;
      const buzz = level * 1.3 * Math.sin(age * 2 * Math.PI * 24) * Math.exp(-age * 9);
      const x = (W - mouseW()) / 2 + buzz;
      const m = mouse(x, MOUSE_Y, MOUSE_H, { press: depth(t), glow: glowOf(c, t), ripples: c.times.map((s) => [t - s, ACCENT]) });
      // vibration arcs on both sides of the mouse, more and brighter for a stronger click
      if (age < 0.45)
        for (let i = 0; i < level; i++) {
          g.strokeStyle = ACCENT;
          g.globalAlpha = (1 - age / 0.45) * (0.45 + 0.1 * level);
          g.lineWidth = 4;
          g.lineCap = "round";
          const r = mouseW() / 2 + 14 + i * 13 + age * 40;
          for (const a of [Math.PI, 0]) {
            g.beginPath();
            g.arc(W / 2, m.by, r, a - 0.42, a + 0.42);
            g.stroke();
          }
          g.globalAlpha = 1;
        }
      // strength: the app's level pills, without numbers
      const pw = 46, gap = 6, x0 = (W - (6 * pw + 5 * gap)) / 2;
      for (let i = 0; i <= 5; i++) {
        g.fillStyle = i === level ? ACCENT : i < level ? "rgba(59,156,255,0.35)" : "rgba(255,255,255,0.1)";
        g.beginPath();
        g.roundRect(x0 + i * (pw + gap), 326, pw, 20, 10);
        g.fill();
      }
    },
  },

  /** The same hand loop on two mice: a slow report rate draws a jagged, jumpy cursor path, a fast one a smooth curve. */
  polling: {
    duration: 2.4,
    draw(t) {
      const T = 2.4;
      const path = (s) => [Math.sin((2 * Math.PI * s) / T), Math.sin((4 * Math.PI * s) / T) / 2];
      clear();
      for (const [cx, every, color] of [[W * 0.25, 0.12, "#ffffff"], [W * 0.75, 0.01, ACCENT]]) {
        monitor(cx - 100, 22, 200, 150);
        const sy = 97, ax = 76, ay = 92;
        const sample = (s) => path(Math.floor(s / every) * every);
        // trail of the last second, through the reported positions only
        g.lineJoin = g.lineCap = "round";
        const n = Math.round(1 / every);
        for (let i = n; i > 0; i--) {
          const a = sample(t - i * every), b = sample(t - (i - 1) * every);
          g.strokeStyle = rgba(color, 0.8 * (1 - i / n));
          g.lineWidth = 3;
          g.beginPath();
          g.moveTo(cx + a[0] * ax, sy + a[1] * ay);
          g.lineTo(cx + b[0] * ax, sy + b[1] * ay);
          g.stroke();
          if (every > 0.05) {
            g.fillStyle = g.strokeStyle;
            dot(cx + b[0] * ax, sy + b[1] * ay, 3.5);
            g.fill();
          }
        }
        const [px, py] = sample(t);
        cursor(cx + px * ax, sy + py * ay);
        // the hand moves smoothly either way
        const [mx, my] = path(t), h = 130;
        mouse(cx - mouseW(h) / 2 + mx * 34, 200 + my * 24, h);
      }
    },
  },

  /** The same hand move twice: at normal DPI the cursor flies past the target, holding DPI shift it lands on it. */
  dpi: {
    duration: 3.6,
    draw(t) {
      const P = 1.8, shift = t >= P, u = (t % P) / P;
      const swing = u < 0.12 || u > 0.88 ? 0 : Math.sin(((u - 0.12) / 0.76) * Math.PI);
      const gain = shift ? 0.72 : 3.6, sx = 240, sy = 100, tx = sx + 36;
      clear();
      monitor(40, 22, 400, 156);
      const hit = shift && swing > 0.92;
      g.strokeStyle = hit ? ACCENT : "rgba(255,255,255,0.55)";
      g.fillStyle = hit ? rgba(ACCENT, 0.25) : "rgba(0,0,0,0)";
      g.lineWidth = 2.5;
      for (const r of [16, 8]) (dot(tx, sy, r), g.fill(), g.stroke());
      g.beginPath();
      g.moveTo(tx - 24, sy);
      g.lineTo(tx - 18, sy);
      g.moveTo(tx + 18, sy);
      g.lineTo(tx + 24, sy);
      g.moveTo(tx, sy - 24);
      g.lineTo(tx, sy - 18);
      g.moveTo(tx, sy + 18);
      g.lineTo(tx, sy + 24);
      g.stroke();
      // cursor trail over the last half second
      const at = (s) => {
        const v = (((s % P) + P) % P) / P;
        return sx + (v < 0.12 || v > 0.88 ? 0 : Math.sin(((v - 0.12) / 0.76) * Math.PI)) * 50 * gain;
      };
      for (let i = 12; i > 0; i--) {
        const s0 = t - (i * 0.5) / 12, s1 = t - ((i - 1) * 0.5) / 12;
        if (s0 < (shift ? P : 0)) continue;
        g.strokeStyle = rgba(shift ? ACCENT : "#ffffff", 0.7 * (1 - i / 12));
        g.lineWidth = 3;
        g.lineCap = "round";
        g.beginPath();
        g.moveTo(at(s0), sy);
        g.lineTo(at(s1), sy);
        g.stroke();
      }
      cursor(sx + swing * 50 * gain, sy);
      const h = 150;
      mouse(240 - mouseW(h) / 2 + swing * 50, 196, h, { side: shift ? 1 : 0 });
    },
  },

  /** Thumb and wheel buttons, each one doing something else: a media key, copy, a DPI change. */
  remap: {
    duration: 3.3,
    draw(t) {
      clear();
      const h = 320, x = 96, y = 18;
      const steps = [["btn-middle", "sensor", 0.3], ["btn-forward", "media", 1.3], ["btn-back", "copy", 2.3]];
      const now = steps.filter(([, , s]) => t >= s).at(-1);
      const press = now && t - now[2] < 0.25 ? 1 : 0;
      mouse(x, y, h, {
        view: "side", zone: now?.[0] ?? "btn-middle", press, glow: now ? clamp(1 - (t - now[2] - 0.25) / 0.3) : 0,
        ripples: now ? [[t - now[2], ACCENT]] : [],
      });
      for (const [zone, name, s] of steps) {
        const age = t - s, fade = 1 - seg(age, 0.95, 1.2);
        if (age < 0 || fade <= 0) continue;
        const z = pics.side.zones[zone], k = h / pics.side.h;
        const zy = y + z.cy * k;
        g.globalAlpha = fade;
        callout(x + z.cx * k, zy, 330, zy, 66, name, age / 0.25);
        g.globalAlpha = 1;
      }
    },
  },

  /** One press of a button and the whole mouse changes: click point, speed and click strength switch together. */
  profiles: {
    duration: 4.0,
    draw(t) {
      const P = 0.8, VALUES = [[3, 0.3, 3], [8, 0.85, 1], [5, 0.55, 5], [1, 1, 0], [7, 0.4, 2]]; // click point 1..10, DPI, haptics 0..5
      const k = Math.floor(t / P), u = t - k * P, prev = VALUES[(k + 4) % 5], cur = VALUES[k % 5];
      const m = ease(seg(u, 0.12, 0.42)), v = prev.map((a, i) => a + (cur[i] - a) * m);
      clear();
      const h = 290, x = 46, y = 22;
      mouse(x, y, h, { side: clamp(1 - u / 0.35) });
      const x0 = 240, x1 = 450, rows = [80, 160, 240];
      // click point: the app's travel bar
      icon("actuation", x0, rows[0] - 9, 18, "rgb(191,194,204)");
      const sw = (x1 - x0 - 30) / 10;
      for (let i = 1; i <= 10; i++) {
        const on = Math.abs(i - v[0]) < 0.5;
        g.fillStyle = on ? ACCENT : i < v[0] ? "rgba(255,255,255,0.1)" : "rgba(59,156,255,0.38)";
        g.beginPath();
        g.roundRect(x0 + 30 + (i - 1) * sw + 1.5, rows[0] - 10, sw - 3, 20, 3);
        g.fill();
      }
      // speed: a filled bar
      icon("sensor", x0, rows[1] - 9, 18, "rgb(191,194,204)");
      g.fillStyle = "rgba(255,255,255,0.1)";
      g.beginPath();
      g.roundRect(x0 + 30, rows[1] - 6, x1 - x0 - 30, 12, 6);
      g.fill();
      g.fillStyle = ACCENT;
      g.beginPath();
      g.roundRect(x0 + 30, rows[1] - 6, (x1 - x0 - 30) * v[1], 12, 6);
      g.fill();
      // click strength: the app's level pills
      icon("haptics", x0, rows[2] - 9, 18, "rgb(191,194,204)");
      const pw = (x1 - x0 - 30 - 5 * 5) / 6, level = Math.round(v[2]);
      for (let i = 0; i <= 5; i++) {
        g.fillStyle = i === level ? ACCENT : i < level ? "rgba(59,156,255,0.35)" : "rgba(255,255,255,0.1)";
        g.beginPath();
        g.roundRect(x0 + 30 + i * (pw + 5), rows[2] - 9, pw, 18, 9);
        g.fill();
      }
      // which of the five profiles is on
      for (let i = 0; i < 5; i++) {
        const on = i === k % 5, pop = on ? Math.sin(seg(u, 0, 0.3) * Math.PI) : 0;
        g.fillStyle = on ? ACCENT : "rgba(255,255,255,0.14)";
        dot(x0 + 30 + i * ((x1 - x0 - 30) / 4), 318, 8 * (1 + 0.4 * pop));
        g.fill();
      }
    },
  },

  /** The same slightly shaky hand: without angle snapping the line wobbles, with it the line is straight. */
  snap: {
    duration: 2.8,
    draw(t) {
      const u = ease(seg(t, 0.2, 2.0)), fade = 1 - seg(t, 2.45, 2.8);
      const wobble = (s) => 0.22 * Math.sin(s * 9.1) + 0.12 * Math.sin(s * 23 + 1) + 0.06 * Math.sin(s * 41 + 2);
      clear();
      for (const [cx, snap, color] of [[W * 0.25, false, "#ffffff"], [W * 0.75, true, ACCENT]]) {
        monitor(cx - 100, 22, 200, 150);
        const ax = 80, ay = 60, sy = 97, at = (s) => [cx - ax + 2 * ax * s, sy + (snap ? 0 : wobble(s) * ay)];
        g.globalAlpha = fade;
        g.strokeStyle = color;
        g.lineWidth = 3;
        g.lineCap = g.lineJoin = "round";
        g.beginPath();
        for (let i = 0; i <= 60; i++) {
          const [px, py] = at((u * i) / 60);
          i ? g.lineTo(px, py) : g.moveTo(px, py);
        }
        g.stroke();
        cursor(...at(u));
        g.globalAlpha = 1;
        const h = 130;
        mouse(cx - mouseW(h) / 2 + (u - 0.5) * 70, 200 + wobble(u) * 30, h);
      }
    },
  },

  /** Lift the mouse to reposition it: set high, the cursor drifts back while the mouse is in the air; set low, it stays put. */
  lod: {
    duration: 3.6,
    draw(t) {
      // hand, twice: slide right, lift, carry back left in the air, put down
      const P = 1.5;
      const phase = (q) => (Math.min(q, 2 * P - 1e-6) % P) / P;
      const slideOf = (q) => {
        const u = phase(q);
        return u < 0.45 ? ease(u / 0.45) : u < 0.55 ? 1 : u < 0.92 ? 1 - ease((u - 0.55) / 0.37) : 0;
      };
      const liftOf = (q) => {
        const u = phase(q);
        return u < 0.45 ? 0 : u < 0.55 ? ease((u - 0.45) / 0.1) : u < 0.86 ? 1 : u < 0.95 ? 1 - ease((u - 0.86) / 0.09) : 0;
      };
      const slide = slideOf(t), lift = liftOf(t), fade = 1 - seg(t, 3.25, 3.6);
      clear();
      for (const [cx, lod] of [[W * 0.25, 0.9], [W * 0.75, 0.2]]) {
        monitor(cx - 100, 22, 200, 130);
        const desk = 318, liftPx = 40, s = 0.16, mw = 976 * s, high = 0.6;
        const sees = (q) => liftOf(q) * high < lod;
        // the cursor follows the hand only while the sensor still sees the desk
        let pos = 0;
        for (let q = 0.01; q <= t; q += 0.01) if (sees(q)) pos += slideOf(q) - slideOf(q - 0.01);
        g.globalAlpha = fade;
        cursor(cx - 70 + pos * 70, 80);
        g.globalAlpha = 1;
        // desk, and the height up to which the sensor still tracks
        g.fillStyle = "rgba(255,255,255,0.14)";
        g.fillRect(cx - 110, desk, 220, 3);
        const ly = desk - lod * liftPx;
        g.strokeStyle = rgba(ACCENT, 0.85);
        g.setLineDash([6, 5]);
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(cx - 110, ly);
        g.lineTo(cx + 110, ly);
        g.stroke();
        g.setLineDash([]);
        // the mouse from the side on the desk, front to the left
        const mx = cx - mw / 2 - 30 + slide * 60, my = desk - lift * high * liftPx;
        g.fillStyle = `rgba(0,0,0,${0.35 * (1 - lift * 0.6)})`;
        g.beginPath();
        g.ellipse(mx + mw / 2, desk + 1, mw * 0.45 * (1 - lift * 0.15), 4, 0, 0, Math.PI * 2);
        g.fill();
        g.save();
        g.translate(mx, my);
        g.rotate(-Math.PI / 2);
        g.scale(s, s);
        g.translate(-12, -12);
        outline(pics.side);
        g.restore();
        // sensor light under the mouse
        g.fillStyle = sees(t) ? ACCENT : "rgba(255,255,255,0.2)";
        dot(mx + 480 * s, my + 2, 4);
        g.fill();
      }
    },
  },

  /** README hero: every feature in turn on the mouse, then all of them go into the mouse. */
  hero: {
    duration: 7.2,
    size: [720, 380],
    draw(t) {
      const B = 0.85, start = (i) => 0.3 + i * B;
      const beat = Math.floor((t - 0.3) / B), u = t - start(beat);
      const gather = ease(seg(t, 5.6, 6.2)), fade = 1 - seg(t, 6.85, 7.2);
      clear();
      const h = 340, k = h / pics.top.h, cx = W / 2;
      const shake = beat === 3 ? Math.sin(seg(u, 0, 0.7) * Math.PI * 2) * 22 : 0;
      const x = cx - mouseW(h) / 2 + shake, y = 18;
      // what the mouse does on each beat
      const o = {};
      if (beat === 0) Object.assign(o, { press: Math.sin(seg(u, 0, 0.5) * Math.PI), glow: seg(u, 0.15, 0.25) * (1 - seg(u, 0.45, 0.6)), ripples: u > 0.22 ? [[u - 0.22, ACCENT]] : [] });
      if (beat === 1) {
        const taps = [0.05, 0.25, 0.45].filter((s) => u > s);
        Object.assign(o, { press: taps.length && u - taps.at(-1) < 0.1 ? 1 : 0, glow: taps.length ? clamp(1 - (u - taps.at(-1)) / 0.18) : 0, ripples: taps.map((s) => [u - s, ORANGE]) });
      }
      if (beat === 2) Object.assign(o, { zone: "btn-right", press: u < 0.15 ? 1 : 0, glow: clamp(1 - u / 0.3), ripples: [[u, ACCENT]] });
      if (beat === 4) o.side = Math.sin(seg(u, 0, 0.7) * Math.PI);
      const halo = (beat === 5 ? Math.sin(seg(u, 0, 0.7) * Math.PI) : 0) + (t > 6.2 ? 1 - seg(t, 6.2, 6.9) : 0);
      if (halo > 0) {
        g.save();
        g.translate(x, y);
        g.scale(k, k);
        g.strokeStyle = rgba(ACCENT, 0.7 * halo);
        g.lineWidth = 26;
        g.stroke(pics.top.parts.find((p) => p.kind === "body").path);
        g.restore();
      }
      const buzz = beat === 2 ? 3 * Math.sin(u * 2 * Math.PI * 24) * Math.exp(-u * 8) : 0;
      mouse(x + buzz, y, h, o);
      if (beat === 2 && u < 0.45)
        for (let i = 0; i < 3; i++) {
          g.strokeStyle = rgba(ACCENT, (1 - u / 0.45) * 0.8);
          g.lineWidth = 4;
          g.lineCap = "round";
          for (const a of [Math.PI, 0]) {
            g.beginPath();
            g.arc(cx, y + 200 * k, mouseW(h) / 2 + 14 + i * 13 + u * 40, a - 0.4, a + 0.4);
            g.stroke();
          }
        }
      if (t > 6.2) {
        const r = seg(t, 6.2, 6.8);
        g.strokeStyle = rgba(ACCENT, 0.8 * (1 - r));
        g.lineWidth = 4;
        dot(cx, y + h * 0.5, 40 + r * 260);
        g.stroke();
      }
      // a callout per feature, each staying once it has appeared
      const at = (dx, dy) => [x + dx * k, y + dy * k];
      const items = [
        ["actuation", at(140, 250), 150, 70], ["rapid", at(150, 380), 150, 190], ["buttons", at(28, 497), 150, 310],
        ["haptics", at(370, 250), W - 150, 70], ["sensor", at(255, 760), W - 150, 190], ["profiles", at(420, 860), W - 150, 310],
      ];
      const order = ["actuation", "rapid", "haptics", "sensor", "buttons", "profiles"];
      for (const [name, [zx, zy], bx, by] of items) {
        const s0 = start(order.indexOf(name)), pop = seg(t, s0, s0 + 0.25);
        if (pop <= 0) continue;
        const color = name === "rapid" ? ORANGE : ACCENT;
        g.globalAlpha = fade;
        if (gather <= 0) callout(zx, zy, bx, by, 64, name, pop, color);
        else if (gather < 1) bubble(bx + (cx - bx) * gather, by + (y + h * 0.5 - by) * gather, 64 * (1 - gather), name, color);
        g.globalAlpha = 1;
      }
    },
  },
};

window.scenes = Object.fromEntries(Object.entries(SCENES).map(([k, v]) => [k, { duration: v.duration, size: v.size ?? [480, 360] }]));
window.render = (name, t) => {
  [W, H] = SCENES[name].size ?? [480, 360];
  if (g.canvas.width !== W || g.canvas.height !== H) [g.canvas.width, g.canvas.height] = [W, H];
  SCENES[name].draw(t);
  const d = g.getImageData(0, 0, W, H).data;
  let s = "";
  for (let i = 0; i < d.length; i += 0x8000) s += String.fromCharCode.apply(null, d.subarray(i, i + 0x8000));
  return btoa(s);
};
</script>
