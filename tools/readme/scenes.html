<!doctype html>
<meta charset="utf-8">
<!-- README illustrations: what each click setting means, drawn on the app's mouse picture frame by frame.
     load(svg) takes src/mouse_top.svg; render(name, t) draws scene `name` at t seconds and returns the RGBA
     pixels as base64. illustrations.mjs records them. -->
<body style="margin:0;background:#000">
<canvas id="c" width="480" height="360"></canvas>
<script>
const W = 480, H = 360;
const g = document.getElementById("c").getContext("2d");
const BG = "#222226", ACCENT = "#3b9cff", ORANGE = "#ff9e33";
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
const rgba = (hex, a) => {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`;
};
const dot = (x, y, r) => (g.beginPath(), g.arc(x, y, r, 0, Math.PI * 2));

// ---------------------------------------------------------------- the mouse, as MouseView draws it

let pic = null;
const attr = (s, name) => new RegExp(`\\b${name}="([^"]*)"`).exec(s)?.[1] ?? "";

window.load = (svg) => {
  const [, w, h] = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(svg);
  const parts = [], groups = [];
  for (const m of svg.matchAll(/<g\b([^>]*)>|<\/g>|<path\b([^>]*?)\/?>/g)) {
    if (m[0] === "</g>") groups.pop();
    else if (m[1] !== undefined) groups.push(attr(m[1], "id"));
    else {
      const a = m[2], cls = attr(a, "class");
      const kind = cls.includes("zone") ? "zone" : cls.includes("body") ? "body" : cls.includes("wheel") ? "wheel"
        : cls.includes("line") ? "line" : groups.includes("brand") ? "brand" : "line";
      parts.push({ kind, id: attr(a, "id"), width: cls.includes("bold") ? 7 : cls.includes("thin") ? 2.4 : 4, path: new Path2D(attr(a, "d")) });
    }
  }
  const left = parts.find((p) => p.id === "btn-left").path;
  pic = { w: +w, h: +h, parts, left, ...centroid(+w, +h, left) };
};

function centroid(w, h, path) {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  const cg = c.getContext("2d");
  cg.fill(path);
  const d = cg.getImageData(0, 0, w, h).data;
  let sx = 0, sy = 0, n = 0, top = h, bottom = 0;
  for (let y = 0; y < h; y += 3)
    for (let x = 0; x < w; x += 3)
      if (d[(y * w + x) * 4 + 3] > 100) (sx += x), (sy += y), n++, (top = Math.min(top, y)), (bottom = Math.max(bottom, y));
  return { cx: sx / n, cy: sy / n, top, bottom };
}

/** The mouse at height h, top-left (x, y); returns where its left button sits on the canvas. */
function mouse(x, y, h, o = {}) {
  const s = h / pic.h, r = { x, y, w: pic.w * s, h };
  g.save(); // floor shadow
  g.translate(x + r.w / 2, y + h * 0.98);
  g.scale(r.w * 0.42, 14);
  dot(0, 0, 1);
  g.restore();
  g.fillStyle = "rgba(0,0,0,0.28)";
  g.fill();
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  g.lineCap = g.lineJoin = "round";
  for (const p of pic.parts) {
    if (p.kind === "body") (g.fillStyle = "#ffffff"), g.fill(p.path);
    else if (p.kind === "wheel") (g.fillStyle = "#6e6e75"), g.fill(p.path);
    else if (p.kind === "brand") (g.fillStyle = "#9c9ca3"), g.fill(p.path);
    else if (p.kind === "line") (g.strokeStyle = "#16161a"), (g.lineWidth = p.width), g.stroke(p.path);
  }
  g.clip(pic.left);
  g.setTransform(1, 0, 0, 1, 0, 0);
  const bx = x + pic.cx * s, by = y + pic.cy * s;
  // press shade and glow, as on the app's live mouse
  g.fillStyle = `rgba(0,0,0,${0.18 * (o.press ?? 0)})`;
  g.fillRect(x, y, r.w, h);
  g.fillStyle = rgba(ACCENT, 0.55 * (o.glow ?? 0));
  g.fillRect(x, y, r.w, h);
  for (const [age, color] of o.ripples ?? []) {
    const k = age / 0.6;
    if (k < 0 || k >= 1) continue;
    dot(bx, by, 6 + r.w * 0.45 * (1 - (1 - k) * (1 - k)));
    g.fillStyle = rgba(color, 0.3 * (1 - k));
    g.fill();
    g.strokeStyle = `rgba(255,255,255,${0.75 * (1 - k)})`;
    g.lineWidth = 3;
    g.stroke();
  }
  g.restore();
  return { bx, by, top: y + pic.top * s, bottom: y + pic.bottom * s, right: x + r.w };
}

// ---------------------------------------------------------------- press-travel gauge (the app's travel bar, upright)

const SEGS = 10;
/** Button travel 0 (up) .. 1 (bottomed out) beside the button; `at` the click point, `band` the rapid trigger lift. */
function gauge(x, top, bottom, o) {
  const sh = (bottom - top) / SEGS, w = 14;
  for (let i = 0; i < SEGS; i++) {
    const y = top + i * sh, through = o.depth * SEGS > i + 0.02;
    g.fillStyle = through ? (o.clicked ? ACCENT : "rgba(255,255,255,0.6)") : "rgba(255,255,255,0.1)";
    g.beginPath();
    g.roundRect(x, y + 1.5, w, sh - 3, 3);
    g.fill();
  }
  const ay = top + o.at * (bottom - top);
  g.fillStyle = ACCENT;
  g.beginPath();
  g.roundRect(x - 4, ay - 2, w + 8, 4, 2);
  g.fill();
  g.fillStyle = "#fff";
  g.beginPath();
  g.moveTo(x - 13, ay - 6);
  g.lineTo(x - 13, ay + 6);
  g.lineTo(x - 6, ay);
  g.fill();
  if (o.band) {
    const [y0, y1] = o.band.map((d) => top + d * (bottom - top));
    g.fillStyle = rgba(ORANGE, 0.85);
    g.beginPath();
    g.roundRect(x + w + 5, y0, 6, Math.max(6, y1 - y0), 3);
    g.fill();
  }
}

// ---------------------------------------------------------------- timing

/** Click and release times up to t for travel depth(s): fires at `A`; with rapid trigger also re-arms after lifting `rt`. */
function clicks(depth, t, A, rt = 0) {
  const out = [];
  let pressed = false, lo = 0, hi = 0;
  for (let s = 0; s <= t + 1e-9; s += 0.002) {
    const d = depth(s);
    if (!pressed) {
      lo = Math.min(lo, d);
      if (d >= A && (!rt || d >= lo + rt)) (pressed = true), (hi = d), out.push(s);
    } else {
      hi = Math.max(hi, d);
      if (d < A || (rt && d <= hi - rt)) (pressed = false), (lo = d);
    }
  }
  return { times: out, pressed, hi };
}
const glowOf = (c, t) => (c.pressed ? 1 : c.times.length ? clamp(1 - (t - c.times.at(-1)) / 0.15) : 0);

function clear() {
  g.fillStyle = BG;
  g.fillRect(0, 0, W, H);
}

function counter(cx, y, n, filled, color, t, times) {
  const x0 = cx - ((n - 1) * 22) / 2;
  for (let i = 0; i < n; i++) {
    const on = i < filled, pop = on ? clamp((t - times[i]) / 0.18) : 1;
    g.fillStyle = on ? color : "rgba(255,255,255,0.12)";
    dot(x0 + i * 22, y, on ? 6.5 * (1 + 0.5 * Math.sin(pop * Math.PI)) : 6.5);
    g.fill();
  }
}

const MOUSE_H = 290, MOUSE_Y = 18;
const mouseW = () => (pic.w * MOUSE_H) / pic.h;

// ---------------------------------------------------------------- scenes

const SCENES = {
  /** The same press on two mice: the shallow click point fires early, the deep one near the bottom. */
  actuation: {
    duration: 3.0,
    draw(t) {
      const depth = (s) => (s < 0.2 ? 0 : s < 1.3 ? seg(s, 0.2, 1.3) : s < 1.6 ? 1 : s < 2.1 ? 1 - ease(seg(s, 1.6, 2.1)) : 0);
      clear();
      for (const [cx, A] of [[W * 0.27, 0.15], [W * 0.73, 0.85]]) {
        const x = cx - mouseW() / 2 + 16, c = clicks(depth, t, A);
        const fired = clicks(depth, 3, A).times[0];
        const m = mouse(x, MOUSE_Y, MOUSE_H, { press: depth(t), glow: glowOf(c, t), ripples: c.times.map((s) => [t - s, ACCENT]) });
        gauge(x - 32, m.top + 10, m.bottom - 10, { depth: depth(t), at: A, clicked: c.pressed });
        // how long the press took to click
        const len = (Math.min(t, fired) - 0.2) * 100;
        g.fillStyle = "rgba(255,255,255,0.10)";
        g.beginPath();
        g.roundRect(cx - 60, 334, 120, 10, 5);
        g.fill();
        if (t > 0.2 && t < 2.2) {
          g.fillStyle = ACCENT;
          g.beginPath();
          g.roundRect(cx - 60, 334, Math.max(10, len), 10, 5);
          g.fill();
        }
      }
    },
  },

  /** The same quick bounces of the button: without rapid trigger one click counts, with it every bounce does. */
  rapid: {
    duration: 3.1,
    draw(t) {
      const depth = (s) => {
        if (s < 0.2) return 0;
        if (s < 0.6) return 0.95 * ease(seg(s, 0.2, 0.6));
        if (s < 1.88) return 0.95 - 0.3 * Math.sin(((s - 0.6) / 0.32) * Math.PI) ** 2;
        if (s < 2.25) return 0.95 * (1 - ease(seg(s, 1.88, 2.25)));
        return 0;
      };
      clear();
      for (const [cx, rt] of [[W * 0.27, 0], [W * 0.73, 0.15]]) {
        const x = cx - mouseW() / 2 + 16, c = clicks(depth, t, 0.45, rt), color = rt ? ORANGE : ACCENT;
        const m = mouse(x, MOUSE_Y, MOUSE_H, { press: depth(t), glow: glowOf(c, t), ripples: c.times.map((s) => [t - s, color]) });
        const band = rt && c.pressed ? [c.hi - rt, c.hi] : null;
        gauge(x - 32, m.top + 10, m.bottom - 10, { depth: depth(t), at: 0.45, clicked: c.pressed, band });
        if (t < 2.75) counter(cx, 338, 5, c.times.length, color, t, c.times);
        else counter(cx, 338, 5, 0, color, t, []);
      }
    },
  },

  /** Six clicks, each one stronger: no vibration, then a light tap up to a firm thump. */
  haptics: {
    duration: 3.9,
    draw(t) {
      const P = 0.62;
      const depth = (s) => {
        const k = Math.floor(s / P), u = s - k * P;
        if (k > 5) return 0;
        return u < 0.1 ? 0 : u < 0.2 ? ease(seg(u, 0.1, 0.2)) : u < 0.26 ? 1 : u < 0.38 ? 1 - ease(seg(u, 0.26, 0.38)) : 0;
      };
      clear();
      const c = clicks(depth, t, 0.5);
      const level = c.times.length ? c.times.length - 1 : 0;
      const age = c.times.length ? t - c.times.at(-1) : 9;
      const buzz = level * 1.3 * Math.sin(age * 2 * Math.PI * 24) * Math.exp(-age * 9);
      const x = (W - mouseW()) / 2 + buzz;
      const m = mouse(x, MOUSE_Y, MOUSE_H, { press: depth(t), glow: glowOf(c, t), ripples: c.times.map((s) => [t - s, ACCENT]) });
      // vibration arcs on both sides of the mouse, more and brighter for a stronger click
      if (age < 0.45)
        for (let i = 0; i < level; i++) {
          g.strokeStyle = ACCENT;
          g.globalAlpha = (1 - age / 0.45) * (0.45 + 0.1 * level);
          g.lineWidth = 4;
          g.lineCap = "round";
          const r = mouseW() / 2 + 14 + i * 13 + age * 40;
          for (const a of [Math.PI, 0]) {
            g.beginPath();
            g.arc(W / 2, m.by, r, a - 0.42, a + 0.42);
            g.stroke();
          }
          g.globalAlpha = 1;
        }
      // strength: the app's level pills, without numbers
      const pw = 46, gap = 6, x0 = (W - (6 * pw + 5 * gap)) / 2;
      for (let i = 0; i <= 5; i++) {
        g.fillStyle = i === level ? ACCENT : i < level ? "rgba(59,156,255,0.35)" : "rgba(255,255,255,0.1)";
        g.beginPath();
        g.roundRect(x0 + i * (pw + gap), 326, pw, 20, 10);
        g.fill();
      }
    },
  },
};

window.scenes = Object.fromEntries(Object.entries(SCENES).map(([k, v]) => [k, v.duration]));
window.size = [W, H];
window.render = (name, t) => {
  SCENES[name].draw(t);
  const d = g.getImageData(0, 0, W, H).data;
  let s = "";
  for (let i = 0; i < d.length; i += 0x8000) s += String.fromCharCode.apply(null, d.subarray(i, i + 0x8000));
  return btoa(s);
};
</script>
